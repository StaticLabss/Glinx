[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glinx"
version = "0.1.0"
description = "Universal hardware-to-agent middleware with high-performance C++ core for real-time IoT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Glinx Contributors" }
]
keywords = ["iot", "hardware", "ai-agents", "mcp", "robotics", "sensors", "embedded"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Hardware",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
mqtt = [
  "aiomqtt>=2.5,<3.0",
]
serial = [
  "pyserial-asyncio-fast>=0.14",
]
mcp = [
  "mcp>=1.10.0,<2.0",
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]
all = [
  "glinx[mqtt,serial,mcp]",
]

[project.scripts]
glinx = "glinx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/glinx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
