name: C++ Core Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev
      
      - name: Configure CMake
        run: |
          cd glinx-core
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd glinx-core/build
          cmake --build . -j$(nproc)
      
      - name: Run tests
        run: |
          cd glinx-core/build
          ctest --output-on-failure
      
      - name: Run benchmarks
        run: |
          cd glinx-core/build
          ./benchmarks/latency_bench
          ./benchmarks/throughput_bench 1000 5

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install cmake python@3.11
      
      - name: Configure CMake
        run: |
          cd glinx-core
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd glinx-core/build
          cmake --build . -j$(sysctl -n hw.ncpu)
      
      - name: Run tests
        run: |
          cd glinx-core/build
          ctest --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Configure CMake
        run: |
          cd glinx-core
          mkdir build
          cd build
          cmake .. -A x64 -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd glinx-core/build
          cmake --build . --config Release
      
      - name: Run tests
        run: |
          cd glinx-core/build
          ctest -C Release --output-on-failure
